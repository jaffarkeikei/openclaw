name: Sync Fork on Upstream Release

on:
  schedule:
    # Check once daily at 04:00 UTC for new upstream releases
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check for new upstream release
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // Get latest stable release from upstream (skip betas)
            const releases = await github.rest.repos.listReleases({
              owner: 'openclaw',
              repo: 'openclaw',
              per_page: 10,
            });
            const stable = releases.data.find(r => !r.prerelease && !r.draft);
            if (!stable) {
              core.info('No stable release found upstream');
              core.setOutput('should_sync', 'false');
              return;
            }
            core.info(`Latest upstream release: ${stable.tag_name} (${stable.published_at})`);
            core.setOutput('tag', stable.tag_name);

            // Check if fork already has this tag
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${stable.tag_name}`,
              });
              core.info(`Fork already has tag ${stable.tag_name}, skipping sync`);
              core.setOutput('should_sync', 'false');
            } catch (e) {
              if (e.status === 404) {
                core.info(`Fork missing tag ${stable.tag_name}, will sync`);
                core.setOutput('should_sync', 'true');
              } else {
                throw e;
              }
            }

      - name: Sync fork with upstream
        if: steps.check.outputs.should_sync == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.check.outputs.tag }}
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.UPSTREAM_TAG;
            try {
              const { data } = await github.rest.repos.mergeUpstream({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
              });
              core.info(`Sync result: ${data.message}`);
              if (data.merge_type) {
                core.info(`Merge type: ${data.merge_type}`);
              }
            } catch (error) {
              if (error.status === 409) {
                core.warning(
                  `Fork has diverged from upstream and cannot be auto-merged for ${tag}. ` +
                  'Manual conflict resolution required:\n' +
                  '  cd openclaw && git fetch upstream && git merge upstream/main'
                );
              } else {
                throw error;
              }
            }
